# Local Airflow for this project (no IBM lab needed).
#
#   mkdir -p data/docker_run/staging && chmod -R 777 data/docker_run
#   cp <tolldata.tgz> data/docker_run/          # real file, or data/sample/tolldata.tgz
#   docker compose up
#
# Then open http://localhost:8080 — login "admin", password is printed in the
# container log (search for "Password for user 'admin'").
services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      TOLL_BASE_DIR: /opt/airflow/finalassignment
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data/docker_run:/opt/airflow/finalassignment
