# Local replacement for the IBM Skills Network lab environment.
# Start the databases:      docker compose up -d
# Start Airflow as well:    docker compose --profile airflow up -d

services:
  mysql:
    image: mysql:8.0
    container_name: softcart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    command: --local-infile=1 --secure-file-priv=""
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: softcart-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./data:/data/import:ro
      - ./02-nosql-mongodb:/work

  postgres:
    image: postgres:16
    container_name: softcart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./03-data-warehouse:/work/03-data-warehouse:ro
      - ./05-etl-pipelines:/work/05-etl-pipelines:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  airflow:
    profiles: ["airflow"]
    image: apache/airflow:2.10.5
    container_name: softcart-airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_DATA_DIR: /opt/airflow/dags/capstone
    ports:
      - "8080:8080"
    volumes:
      - ./05-etl-pipelines/airflow:/opt/airflow/dags
      - ./data/accesslog.txt:/opt/airflow/dags/capstone/accesslog.txt

volumes:
  mysql_data:
  mongo_data:
  pg_data:
